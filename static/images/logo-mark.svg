<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Statusengine">
  <!-- An area chart on the brand gradient: metrics are what Statusengine
       moves, and the filled area is what separates this from the plain
       polyline.

       The area runs all the way to the bottom of the tile and is clipped by
       the rounded rect, rather than stopping at a baseline of its own —
       otherwise its lower edge reads as a floating rectangle at large sizes. -->
  <defs>
    <linearGradient id="se-mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9503d"/>
      <stop offset="1" stop-color="#8c2f24"/>
    </linearGradient>
    <linearGradient id="se-mark-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <clipPath id="se-mark-clip"><rect width="32" height="32" rx="8"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#se-mark-bg)"/>
  <path d="M6.4 32V17.6L12.8 12.8 19.2 19.2 25.6 9.6V32Z"
        fill="url(#se-mark-area)" clip-path="url(#se-mark-clip)"/>
  <path d="M6.4 17.6 12.8 12.8 19.2 19.2 25.6 9.6"
        fill="none" stroke="#fff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
